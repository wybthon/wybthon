name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Black)
        run: uv run black --check .

      - name: Type check (MyPy)
        run: uv run mypy

      - name: Run tests
        run: |
          uv run pytest -q --cov=wybthon --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=45
      - name: Upload coverage to artifacts
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  e2e:
    name: E2E (Pyodide + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --group dev

      # The Pyodide runtime is fetched from the jsdelivr CDN by bootstrap.js at
      # browser runtime, so it cannot be cached as a build artifact. We cache the
      # Playwright browser binary instead, which is the expensive install step.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # Runs the full browser fixture suite (one route per framework feature)
      # plus the demo Pyodide smoke test; both live under tests/e2e and are
      # marked ``e2e``. The fixture suite boots Pyodide once and navigates via
      # the client-side router, so the whole suite shares a single cold start.
      - name: Run E2E suite (Playwright)
        run: uv run pytest -q -m e2e tests/e2e
