name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Framework Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install package
        run: uv sync --locked

      - name: Run benchmark
        run: uv run python benchmarks/bench_runner.py --memory

      - name: Run benchmark (JSON)
        run: uv run python benchmarks/bench_runner.py --memory --json > bench_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.json

  browser-benchmark:
    name: Browser Benchmark (Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install package and Playwright
        run: uv sync --locked --group dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-bench-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-bench-

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run browser benchmark
        shell: bash
        run: |
          uv run python benchmarks/browser_bench.py --mode signal --json > browser_signal_results.json
          uv run python benchmarks/browser_bench.py --mode store --json > browser_store_results.json
          uv run python benchmarks/check_work.py browser_store_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-benchmark-results
          path: browser_*_results.json
