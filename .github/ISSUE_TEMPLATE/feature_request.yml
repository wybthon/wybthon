name: Feature request
description: Suggest a capability or API for Wybthon.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build that Wybthon makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you have in mind. Sketch the Python you'd want to write.
      render: python
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or rejected, and why.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Prior art from other frameworks, links, or notes on scope.
    validations:
      required: false
