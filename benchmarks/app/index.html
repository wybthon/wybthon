<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wybthon – js-framework-benchmark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <style>
    .jumbotron { margin-top: 10px; }
    .preloadicon { display: none; }
    .smallpad { padding: 5px; }
  </style>
</head>
<body>
  <div class="container" id="main">
    <div class="jumbotron">
      <div class="row">
        <div class="col-md-6">
          <h1>Wybthon (keyed)</h1>
        </div>
        <div class="col-md-6">
          <div class="row">
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="run">Create 1,000 rows</button>
            </div>
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="runlots">Create 10,000 rows</button>
            </div>
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="add">Append 1,000 rows</button>
            </div>
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="update">Update every 10th row</button>
            </div>
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="clear">Clear</button>
            </div>
            <div class="col-sm-6 smallpad">
              <button type="button" class="btn btn-primary btn-block" id="swaprows">Swap Rows</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="table-container"></div>
    <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
    <div id="bench-panel" style="display:none; margin-top:20px;">
      <button type="button" class="btn btn-success btn-lg" id="run-bench-btn" onclick="runFullBenchmark()">
        Run Full Benchmark
      </button>
      <pre id="bench-output" style="margin-top:10px; background:#222; color:#0f0; padding:12px; border-radius:6px; font-size:13px;"></pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
  <script>


    async function main() {
      const statusEl = document.createElement('p');
      statusEl.textContent = 'Loading Pyodide...';
      document.getElementById('table-container').appendChild(statusEl);

      const pyodide = await loadPyodide();
      statusEl.textContent = 'Loading Wybthon...';

      pyodide.FS.mkdir('/lib/wybthon');
      pyodide.FS.mkdir('/lib/wybthon/reactivity');
      const manifest = await fetch('/__manifest?dir=src/wybthon');
      if (!manifest.ok) throw new Error('Run this benchmark through wyb dev');
      const modules = await manifest.json();
      await Promise.all(modules.map(async mod => {
        const resp = await fetch('../../src/wybthon/' + mod);
        const text = await resp.text();
        pyodide.FS.writeFile('/lib/wybthon/' + mod, text);
      }));
      pyodide.runPython('import sys; sys.path.insert(0, "/lib")');

      statusEl.textContent = 'Starting benchmark app...';
      const appResp = await fetch('./main.py');
      const appCode = await appResp.text();
      await pyodide.runPythonAsync(appCode);

      statusEl.remove();
      window._pyodide = pyodide;
      document.getElementById('bench-panel').style.display = 'block';
      console.log('[BENCH] Ready');
    }

    main().catch(err => {
      console.error('Wybthon benchmark failed to load:', err);
      const el = document.getElementById('table-container');
      el.innerHTML = '<p class="text-danger">Failed to load: ' + err.message + '</p>';
    });

    async function runFullBenchmark() {
      const py = window._pyodide;
      const out = document.getElementById('bench-output');
      const btn = document.getElementById('run-bench-btn');
      btn.disabled = true;
      btn.textContent = 'Running...';
      out.textContent = '';

      function log(msg) {
        out.textContent += msg + '\n';
        console.log(msg);
      }

      function paint() {
        return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));
      }

      function snapshot() {
        const rows = document.querySelectorAll('#tbody > tr');
        return JSON.stringify({count: rows.length, first: rows[0]?.textContent, last: rows[rows.length - 1]?.textContent,
          second: rows[1]?.textContent, swapped: rows[998]?.textContent, selected: document.querySelector('#tbody .danger')?.textContent});
      }
      async function setup(code) {
        py.runPython(code);
        await paint();
      }
      const scenarios = [
        {name: 'create_1k', setup: 'clear()', target: '#run'},
        {name: 'replace_1k', setup: 'run()', target: '#run'},
        {name: 'create_10k', setup: 'clear()', target: '#runlots'},
        {name: 'update_10th_10k', setup: 'run_lots()', target: '#update'},
        {name: 'select_10k', setup: 'run_lots()', target: '#tbody tr:first-child td:nth-child(2) a'},
        {name: 'swap_10k', setup: 'run_lots()', target: '#swaprows'},
        {name: 'remove_10k', setup: 'run_lots()', target: '#tbody tr:first-child td:nth-child(3) a'},
        {name: 'append_to_10k', setup: 'run_lots()', target: '#add'},
        {name: 'clear_10k', setup: 'run_lots()', target: '#clear'},
      ];
      const results = {mode: new URLSearchParams(location.search).get('mode') || 'signal', pyodide: '314.0.6', user_agent: navigator.userAgent, warmups: 1, samples: 3, scenarios: {}};
      py.runPython('from wybthon.diagnostics import profile; import json');
      for (const scenario of scenarios) {
        const samples = [];
        for (let i = 0; i < 4; i++) {
          await setup(scenario.setup);
          const before = snapshot();
          py.runPython('_bench_scope = profile(); _bench_metrics = _bench_scope.__enter__()');
          const start = performance.now();
          document.querySelector(scenario.target).click();
          const commit = performance.now() - start;
          await paint();
          const frame = performance.now() - start;
          py.runPython('_bench_scope.__exit__(None, None, None)');
          const metrics = JSON.parse(py.runPython('json.dumps(dict(_bench_metrics.counts))'));
          if (snapshot() === before) throw new Error(`${scenario.name} did no observable work`);
          const count = document.querySelectorAll('#tbody > tr').length;
          if (scenario.name === 'append_to_10k' && count !== 11000) throw new Error('Append baseline must be 10,000 rows');
          if (i) samples.push({sync_commit_ms: commit, input_to_frame_ms: frame, counts: metrics});
        }
        samples.sort((a, b) => a.sync_commit_ms - b.sync_commit_ms);
        const frames = samples.map(sample => sample.input_to_frame_ms).sort((a, b) => a - b);
        results.scenarios[scenario.name] = {...samples[1], input_to_frame_ms: frames[1], samples};
        log(`[BENCH] ${scenario.name}: commit ${samples[1].sync_commit_ms.toFixed(1)} ms, input-to-frame ${frames[1].toFixed(1)} ms`);
      }
      results.registry = JSON.parse(py.runPython('json.dumps(__import__("wybthon").kernel.stats())'));
      log('[BENCH] RESULTS_JSON=' + JSON.stringify(results));

      btn.textContent = 'Benchmark Complete';
    }
  </script>
</body>
</html>
